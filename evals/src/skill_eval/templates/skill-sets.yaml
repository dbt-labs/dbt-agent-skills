sets:
  # `model` is required on every set (e.g. sonnet, opus, or a full model ID) so
  # runs are reproducible instead of silently depending on the `claude` CLI's
  # built-in default.

  # Baseline: no skills, read-only tools
  - name: no-skills
    model: sonnet
    skills: []
    allowed_tools:
      - Read
      - Glob
      - Grep


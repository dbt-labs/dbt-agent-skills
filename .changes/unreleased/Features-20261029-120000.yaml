kind: Features
body: Add an OpenAI Codex plugin marketplace, so the `dbt`, `dbt-migration`, and `dbt-extras` plugins install with `codex plugin marketplace add dbt-labs/dbt-agent-skills`. `scripts/validate_repo.py` now checks the Codex marketplace and the version in each `.codex-plugin/plugin.json`.

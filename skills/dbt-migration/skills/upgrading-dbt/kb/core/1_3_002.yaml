issue_id: "1_3_002"
sort_order: 1020
change: >-
  on-run-start / on-run-end hooks no longer halt execution on failure
action: >-
  Find alternative approaches if hooks were used as guards/circuit-breakers that must abort a run
category: Behavior
component: core
adapter_type: null
impact: >-
  A failing on-run-start/on-run-end hook now appends an error result and continues instead of
  raising; guard/circuit-breaker hooks no longer abort the run. Separately, if the guard hook's SQL
  unconditionally calls exceptions.raise_compiler_error() (not gated behind a var that a real run
  would set), dbt parse itself hits that error, because hook Jinja is rendered during parse/compile
  -- this project can never reach parse-clean through this skill's dbt parse, independent of the
  migration. That parse failure belongs to this issue, not to a rewrite that was never attempted.
from_version: '1.3'
to_version: '1.4'
automation_type: human
out_of_repo_risk: false
environment_change: false
context:
  detection: |-
    - Read dbt_project.yml for on-run-start: and on-run-end: keys (string or list).
    - Also scan these keys in any vendored package dbt_project.yml.
    - Flag hooks whose SQL acts as a precondition/guard:
      - a SELECT that RAISES/THROWS, or calls an assertion macro;
      - `{% if ... %}{{ exceptions.raise_compiler_error(...) }}{% endif %}`;
      - SQL that intentionally errors (divide-by-zero, invalid cast) to stop a run.
    - Purely side-effecting hooks (grants, logging, audit inserts) are NOT affected.
  fixing: |-
    - There is no code fix for this issue -- it is always manual-required, whether or not dbt parse
      happens to succeed. Never rewrite the hook's SQL. Never add, remove, or edit ANY file for this
      issue alone (not dbt_project.yml, not the hook, nothing) -- set-status manual-required directly.
    - For guard hooks: document that they no longer abort the run in 1.4+, and recommend moving the
      precondition into a pre-flight step outside the run (a separate `dbt run-operation` gate in
      CI, or a data test CI checks before proceeding).
    - Record each guard-style hook in the results report with issue_id, the dbt_project.yml
      location, and the suggested CI-gate alternative. The note MUST describe the hook aborting/
      halting the run today, since that current behavior is exactly what 1.4+ removes.
    - dbt parse impact is NOT guaranteed absent, and this is not something to fix: if the guard's
      SQL calls exceptions.raise_compiler_error() (or similar) unconditionally -- not gated behind a
      var a real run would set -- dbt parse hits that same error during compilation, because hook
      Jinja is rendered while building the manifest, with or without a warehouse. That parse failure
      is attributable to THIS manual-required issue, exactly like an environment_change item, and
      Step 7 already excludes manual-required-attributable failures from the parse gate -- do not
      mark this issue failed, do not try repeatedly to make it parse, and do not let it block the
      rest of the migration from reaching a clean report. If the hook is unconditional like this,
      say so plainly in the note (e.g. "dbt parse cannot succeed while this guard hook is
      unconditional; unrelated to this migration") so the report doesn't read as an unresolved bug.

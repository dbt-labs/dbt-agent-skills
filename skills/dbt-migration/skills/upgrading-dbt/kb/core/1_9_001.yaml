issue_id: "1_9_001"
sort_order: 7001
change: >-
  macro arguments are validated against their declared signatures
action: >-
  Set flags.validate_macro_args: false to keep validation off, or correct the macro argument declarations.
category: Behavior
component: core
adapter_type: null
impact: >-
  Macros whose calls do not match their documented arguments now warn or error at parse time. This flag defaults to True in 1.12, so leaving it unset silently adopts the new behavior.
from_version: '1.9'
to_version: '1.10'
automation_type: behavior_flag
behavior_flag:
  name: validate_macro_args
  set_to: false
out_of_repo_risk: false
environment_change: false
context:
  detection: |-
    - Applies only if the project has macros whose call sites disagree with their
      declared arguments (the thing validation would now reject).
    - Check macros/ for documented `arguments:` in YAML that do not match the macro
      signature, or calls passing unexpected/missing args.
    - The reliable check: run the parse gate; if it reports a macro-argument
      validation error/warning, the behavior is exhibited.
    - Parse clean with the flag unset -> skipped-not-present.
  fixing: |-
    Pin the flag via `tools.py set-flag --issue-id 1_9_001`. No project code changes.
    Prefer pinning only when the parse gate actually flags a macro-argument problem.

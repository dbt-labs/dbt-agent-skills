issue_id: "1_5_002"
sort_order: 3020
change: Duplicate node names allowed across packages
action: >-
  Disambiguate cross-package references with two-argument ref('package_name', 'model_name')
category: Behavior
component: core
adapter_type: null
impact: >-
  In 1.5 a flat manifest dict raised DuplicateResourceNameError; in 1.6 names are stored per-package,
  so a project and an installed package can legitimately share a model name. Single-argument ref() to
  a name that exists in more than one package becomes ambiguous (AmbiguousAliasError / wrong node).
from_version: '1.5'
to_version: '1.6'
automation_type: human
out_of_repo_risk: false
environment_change: false
context:
  detection: |-
    - Only relevant if packages.yml / dependencies.yml declares packages.
    - Build the set of model/seed/snapshot names defined in the local project (models/**/*.sql,
      seeds/**/*.csv, snapshots/**/*.sql).
    - Where available, add the names exposed by installed packages under dbt_packages/*/models.
    - Grep all .sql/.yml for single-argument `ref('name')` / `ref("name")` whose `name` collides
      with a name present in BOTH the local project and a package (or in two packages) — those are
      the ambiguous refs.
    - If no packages are installed, mark skipped-not-present.
  fixing: |-
    - For each ambiguous single-arg ref, rewrite to the two-argument form
      `ref('<package_name>', '<model_name>')`.
    - Choose the package the author intended; default to the local project's own model unless the
      surrounding SQL clearly consumes the package's version.
    - Example: `ref('customers')` -> `ref('my_project', 'customers')` or
      `ref('dbt_utils', 'customers')`. Leave unambiguous refs untouched.
    - NEVER edit anything under dbt_packages/ (or any other installed/vendored-package directory) to
      make this issue resolve. dbt regenerates that directory from `dbt deps`; a hand-edit there is
      silently discarded on the customer's next `dbt deps` run, so it is not a real fix no matter how
      clean the resulting parse looks in this session.
    - The two-arg ref rewrite can still leave the project unable to parse if the local model and the
      package model also collide on their materialized relation identifier (same schema + alias) --
      a separate problem from name ambiguity, and NOT something this issue's fix touches. If that
      happens, do not alias or rename the package's model to work around it: record it
      manual-required, name both colliding nodes and their shared relation identifier, and say the
      customer needs to alias one of them (in their own project config, not by hand-editing the
      installed package) or exclude/replace the package model. Leave the ref rewrite you already made
      in place; only the relation-collision part is manual-required.
    - After edits run `dbt parse`; a remaining AmbiguousAliasError names the offending ref and node. A
      relation-identifier collision (not AmbiguousAliasError) is the manual-required case above, not
      a signal to keep editing.
    - If you cannot determine which package is intended, record it in the results report
      rather than guessing — picking the wrong package silently changes lineage.

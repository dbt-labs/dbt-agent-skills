issue_id: "1_11_006"
sort_order: 9006
change: >-
  versioned models get a `latest` version pointer by default
action: >-
  Leave flags.latest_version_pointer_enabled_by_default: false to keep explicit-only version pointers.
category: Behavior
component: core
adapter_type: null
impact: >-
  For versioned models, ref() without a version can resolve differently. This flag still defaults to False in 1.12; pinning it makes that explicit and survives a future flip.
from_version: '1.11'
to_version: '1.12'
automation_type: behavior_flag
behavior_flag:
  name: latest_version_pointer_enabled_by_default
  set_to: false
out_of_repo_risk: false
environment_change: false
context:
  detection: |-
    - Applies only if the project uses MODEL VERSIONS (`versions:` in model YAML)
      and has `ref()` calls to a versioned model without an explicit version.
    - No versioned models -> the pointer default cannot matter -> skipped-not-present.
  fixing: |-
    Pin the flag via `tools.py set-flag --issue-id 1_11_006`. No project code changes.
    Only pin it when versioned models exist and are ref'd without a version.

issue_id: "1_11_004"
sort_order: 9004
change: >-
  source and semantic model names may not contain spaces
action: >-
  Set flags.require_source_and_semantic_model_names_without_spaces: false to keep allowing spaces, or rename them.
category: Behavior
component: core
adapter_type: null
impact: >-
  Sources/semantic models with spaces in their names start erroring rather than warning. This flag still defaults to False in 1.12; pinning it makes that explicit and survives a future flip.
from_version: '1.11'
to_version: '1.12'
automation_type: behavior_flag
behavior_flag:
  name: require_source_and_semantic_model_names_without_spaces
  set_to: false
out_of_repo_risk: false
environment_change: false
context:
  detection: |-
    - Applies only if a SOURCE or SEMANTIC MODEL name contains a space.
    - Grep source/semantic model YAML for `- name:` values containing a space.
      (Model names with spaces are a different, pre-1.8 issue — not this one.)
    - No spaces in source/semantic model names -> skipped-not-present.
  fixing: |-
    Pin the flag via `tools.py set-flag --issue-id 1_11_004`. No project code changes.
    Only pin it when a source/semantic model name actually contains a space.

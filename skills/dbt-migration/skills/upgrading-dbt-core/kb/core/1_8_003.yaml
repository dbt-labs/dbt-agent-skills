issue_id: "1_8_003"
sort_order: 6003
change: >-
  custom microbatch strategies must use batched execution
action: >-
  Set flags.require_batched_execution_for_custom_microbatch_strategy: false to keep the old behavior, or adopt batched execution.
category: Behavior
component: core
adapter_type: null
impact: >-
  A custom microbatch incremental strategy that is not batch-aware behaves differently or errors. This flag defaults to True in 1.12, so leaving it unset silently adopts the new behavior.
from_version: '1.8'
to_version: '1.9'
automation_type: behavior_flag
behavior_flag:
  name: require_batched_execution_for_custom_microbatch_strategy
  set_to: false
out_of_repo_risk: false
environment_change: false
context:
  detection: |-
    - Applies only if the project defines a CUSTOM microbatch incremental strategy.
    - Check macros/ for a macro named `get_incremental_microbatch_sql` or a
      materialization/strategy override handling `microbatch`, and models configured
      with `incremental_strategy: microbatch`.
    - Built-in microbatch usage alone is NOT affected -> skipped-not-present.
  fixing: |-
    Pin the flag via `tools.py set-flag --issue-id 1_8_003`. No project code changes.
    Only pin it when a custom microbatch strategy macro exists.

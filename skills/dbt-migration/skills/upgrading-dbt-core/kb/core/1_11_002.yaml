issue_id: "1_11_002"
sort_order: 9002
change: >-
  sql_header must be declared in test configs to take effect
action: >-
  Set flags.require_sql_header_in_test_configs: false to keep the old handling.
category: Behavior
component: core
adapter_type: null
impact: >-
  Tests relying on an implicitly inherited sql_header may lose it. This flag still defaults to False in 1.12; pinning it makes that explicit and survives a future flip.
from_version: '1.11'
to_version: '1.12'
automation_type: behavior_flag
behavior_flag:
  name: require_sql_header_in_test_configs
  set_to: false
out_of_repo_risk: false
environment_change: false
context:
  detection: |-
    - Applies only if tests rely on a `sql_header` they do not declare themselves
      (i.e. inherited from a model/project-level config).
    - Grep for `sql_header` in dbt_project.yml, model configs, and test configs; the
      issue is present when a test needs it but only a non-test config sets it.
    - No sql_header anywhere, or tests declare their own -> skipped-not-present.
  fixing: |-
    Pin the flag via `tools.py set-flag --issue-id 1_11_002`. No project code changes.
    Only pin it when a test depends on an inherited sql_header.

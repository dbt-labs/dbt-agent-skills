issue_id: "1_10_001"
sort_order: 8001
change: >-
  resource names must be unique within a project
action: >-
  Set flags.require_unique_project_resource_names: false to keep allowing duplicates, or rename the colliding resources.
category: Behavior
component: core
adapter_type: null
impact: >-
  Projects with two resources sharing a name across paths start erroring at parse time. This flag still defaults to False in 1.12; pinning it makes that explicit and survives a future flip.
from_version: '1.10'
to_version: '1.11'
automation_type: behavior_flag
behavior_flag:
  name: require_unique_project_resource_names
  set_to: false
out_of_repo_risk: false
environment_change: false
context:
  detection: |-
    - Applies only if the project has DUPLICATE resource names within itself.
    - List model/seed/snapshot/test file stems and look for the same name declared
      more than once across different paths.
    - All names unique -> skipped-not-present.
  fixing: |-
    Pin the flag via `tools.py set-flag --issue-id 1_10_001`. No project code changes.
    Only pin it when an actual duplicate resource name exists.

issue_id: "1_9_003"
sort_order: 7003
change: >-
  generic test arguments must be declared under an `arguments:` property
action: >-
  Set flags.require_generic_test_arguments_property: false to keep accepting the old inline shape, or move test args under `arguments:`.
category: Behavior
component: core
adapter_type: null
impact: >-
  Generic tests passing args inline (not under `arguments:`) fail validation. This flag defaults to True in 1.12, so leaving it unset silently adopts the new behavior.
from_version: '1.9'
to_version: '1.10'
automation_type: behavior_flag
behavior_flag:
  name: require_generic_test_arguments_property
  set_to: false
out_of_repo_risk: false
environment_change: false
context:
  detection: |-
    - Applies only if generic tests pass arguments inline instead of under an
      `arguments:` property.
    - Grep models/**/*.yml (and any tests/ YAML) for generic tests with sibling keys
      next to the test name that are not `arguments:` (e.g. `accepted_values:` with
      `values:` inline).
    - All generic test args already under `arguments:`, or no parameterized generic
      tests -> skipped-not-present.
  fixing: |-
    Pin the flag via `tools.py set-flag --issue-id 1_9_003`. No project code changes.
    Only pin it when inline generic-test arguments are present.

issue_id: from_1.5_to_1.6_004
sort_order: 3040
change: Python 3.7 support dropped (dbt-core)
action: Ensure the runtime uses Python 3.8+ and advise updating any pinned requirement
category: Breaking
component: core
adapter_type: null
impact: dbt-core 1.6 sets python_requires>=3.8; installing on Python 3.7 fails.
from_version: '1.5'
to_version: '1.6'
automation_type: human
out_of_repo_risk: false
environment_change: true
context:
  detection: |-
    - This is an environment/runtime concern, not a project-code issue.
    - Look for a pinned Python 3.7 in in-repo dependency/CI files:
      - requirements.txt
      - pyproject.toml ([project] requires-python / tool.poetry.dependencies python)
      - setup.py / setup.cfg
      - Dockerfile (FROM python:3.7*)
      - tox.ini, .python-version
      - CI workflows (.github/workflows/*.yml with `python-version: 3.7`)
    - Flag any that pin or allow 3.7 as the ceiling.
  fixing: |-
    - ADVISORY ONLY — never run pip/poetry/any install.
    - Edit in-repo dependency declarations to require Python >=3.8, e.g. `python_requires='>=3.8'`,
      `requires-python = '>=3.8'`, `FROM python:3.8`, CI matrix `python-version: '3.8'`+.
    - Record the change in the migration log and add a manual-actions note telling the user to
      recreate/upgrade their virtualenv and CI runners to Python 3.8+.
    - Excluded from the dbt parse verify loop because the runtime is unchanged at fix time.
